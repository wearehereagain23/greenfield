    <title>404 - Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            background: url('https://illustrations.popsy.co/gray/web-error.svg') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #2c3e50;
            padding: 20px;
        }

        .content {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 12px;
            max-width: 500px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(4px);
        }

        .content h1 {
            font-size: 6rem;
            color: #ff6b6b;
            line-height: 1;
            margin-bottom: 10px;
        }

        .content h2 {
            font-size: 2rem;
            margin: 10px 0;
            font-weight: 600;
        }

        .content p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #5a738e;
        }

        .btn {
            display: inline-block;
            background-color: #1e90ff;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: background 0.3s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: #0f78d1;
        }

        .btn:active {
            transform: scale(0.98);
        }

        @media (max-width: 600px) {
            .content h1 {
                font-size: 4rem;
            }

            .content h2 {
                font-size: 1.5rem;
            }

            .content {
                padding: 30px 20px;
            }
        }
    </style>
</head>
